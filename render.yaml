services:
  # Backend API
  - type: web
    name: map-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: ALLOWED_ORIGINS
        value: https://map-frontend.onrender.com,https://map-backend.onrender.com,https://your-bot-domain.com
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: map-frontend
    env: static
    buildCommand: echo "No build required"
    staticPublishPath: frontend
